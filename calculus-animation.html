<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculus Animation</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, sans-serif;
      background: #f1f5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #cfe3ff 0%, #ffffff 35%, #eef4ff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .frame {
      width: min(1200px, 100%);
      aspect-ratio: 16 / 9;
      background: #ffffff;
      border: 1px solid rgba(0, 40, 85, 0.12);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 48px 120px rgba(2, 13, 51, 0.12);
      position: relative;
      display: grid;
      place-items: center;
    }

    .scene-card {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px;
      background: linear-gradient(180deg, #ffffff 0%, #eef4ff 100%);
      position: relative;
      overflow: hidden;
    }

    .scene-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(0, 72, 156, 0.14), transparent 28%),
                  radial-gradient(circle at bottom left, rgba(30, 94, 196, 0.08), transparent 20%);
      pointer-events: none;
    }

    .scene-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1080px;
      transition: transform 0.8s ease, opacity 0.8s ease;
    }

    .scene-title {
      font-size: clamp(3rem, 3.4vw, 5rem);
      font-weight: 800;
      line-height: 1.05;
      color: #002855;
      margin: 0 0 0.85em;
    }

    .scene-line {
      font-size: clamp(1.25rem, 1.7vw, 2.25rem);
      line-height: 1.5;
      margin: 0 0 1rem;
      color: #102a43;
      opacity: 0.95;
    }

    .mono {
      font-family: Menlo, ui-monospace, SFMono-Regular, monospace;
    }

    .accent-bar {
      height: 8px;
      width: 180px;
      border-radius: 999px;
      background: linear-gradient(90deg, #002855, #1f4fa1);
      margin-bottom: 40px;
    }

    .controls {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 2;
    }

    .progress {
      flex: 1;
      height: 10px;
      border-radius: 999px;
      background: rgba(0, 40, 85, 0.12);
      overflow: hidden;
      margin-right: 16px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1f4fa1, #47a7ff);
      transition: width 0.2s ease;
    }

    .button {
      border: none;
      border-radius: 999px;
      padding: 14px 24px;
      background: #002855;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      background: #1f4fa1;
    }

    .note {
      position: absolute;
      top: 24px;
      left: 24px;
      color: #334e68;
      font-size: 0.95rem;
      z-index: 2;
      background: rgba(255,255,255,0.78);
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(0, 40, 85, 0.1);
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="scene-card">
      <div class="scene-inner" id="sceneInner">
        <div class="accent-bar"></div>
        <h1 class="scene-title" id="sceneTitle">Loading…</h1>
        <div id="sceneLines"></div>
      </div>
      <div class="note" id="sceneLabel">Scene 1 / 10</div>
      <div class="controls">
        <div class="progress" aria-label="Scene progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <button class="button" id="toggleBtn">Pause</button>
      </div>
    </div>
  </div>

  <script>
    const scenes = [
      {
        title: 'The Fundamental Theorem of Calculus',
        lines: ['A focused lecture for Calculus I students.']
      },
      {
        title: 'Learning Objectives',
        lines: [
          'State both parts of the theorem.',
          'Use antiderivatives to evaluate definite integrals.',
          'Interpret accumulation and rates of change.'
        ]
      },
      {
        title: 'Review: Definite Integrals',
        lines: [
          'A definite integral computes net area under a curve from a to b.',
          'It measures accumulation of quantity over an interval.'
        ]
      },
      {
        title: 'FTC Part I',
        lines: ["If F is an antiderivative of f, then F'(x) = f(x)."]
      },
      {
        title: 'Worked Example: FTC Part I',
        lines: [
          'Let F(x) = x³.',
          "Then F'(x) = 3x².",
          'This recovers the original function f(x) = 3x².'
        ]
      },
      {
        title: 'FTC Part II',
        lines: ['∫ₐᵇ f(x) dx = F(b) - F(a)']
      },
      {
        title: 'Worked Example: ∫₀² 3x² dx',
        lines: [
          'Antiderivative F(x) = x³.',
          'Evaluate from 0 to 2: F(2) - F(0) = 8 - 0.',
          'Result: 8.'
        ]
      },
      {
        title: 'Applications',
        lines: [
          'Compute areas between curves.',
          'Use velocity to find distance traveled.',
          'Model accumulation in science and economics.'
        ]
      },
      {
        title: 'Summary',
        lines: [
          "Part I: F'(x) = f(x).",
          'Part II: ∫ₐᵇ f(x) dx = F(b) - F(a).',
          'The theorem links derivatives and integrals.'
        ]
      }
    ];

    const sceneInner = document.getElementById('sceneInner');
    const sceneTitle = document.getElementById('sceneTitle');
    const sceneLines = document.getElementById('sceneLines');
    const sceneLabel = document.getElementById('sceneLabel');
    const progressFill = document.getElementById('progressFill');
    const toggleBtn = document.getElementById('toggleBtn');

    const sceneDuration = 6000;
    const fadeDuration = 900;
    let currentIndex = 0;
    let playing = true;
    let lastTimestamp = null;
    let elapsed = 0;

    function renderScene(index, progress) {
      const scene = scenes[index];
      sceneTitle.textContent = scene.title;
      sceneLines.innerHTML = scene.lines
        .map(line => {
          const mono = /∫|F\(|F\'|x³|3x²/.test(line);
          return `<div class="scene-line ${mono ? 'mono' : ''}">${line}</div>`;
        })
        .join('');

      sceneLabel.textContent = `Scene ${index + 1} / ${scenes.length}`;
      progressFill.style.width = `${progress * 100}%`;
    }

    function ease(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function updateAnimation(delta) {
      elapsed += delta;
      const local = Math.min(elapsed, sceneDuration);
      const progress = local / sceneDuration;

      const fadeIn = Math.max(0, Math.min(1, local / fadeDuration));
      const fadeOut = Math.max(0, Math.min(1, (sceneDuration - local) / fadeDuration));
      const opacity = Math.min(fadeIn, fadeOut);
      const translateY = 40 * (1 - ease(opacity));

      sceneInner.style.opacity = opacity.toFixed(3);
      sceneInner.style.transform = `translateY(${translateY}px)`;
      renderScene(currentIndex, progress);

      if (elapsed >= sceneDuration) {
        elapsed = 0;
        currentIndex = (currentIndex + 1) % scenes.length;
      }
    }

    function tick(timestamp) {
      if (!lastTimestamp) {
        lastTimestamp = timestamp;
      }

      const delta = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      if (playing) {
        updateAnimation(delta);
      }

      requestAnimationFrame(tick);
    }

    toggleBtn.addEventListener('click', () => {
      playing = !playing;
      toggleBtn.textContent = playing ? 'Pause' : 'Play';
    });

    renderScene(currentIndex, 0);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
